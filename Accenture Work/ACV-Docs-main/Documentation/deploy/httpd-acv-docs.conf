# =============================================================
# Apache httpd — ACV Documentation Hub (RHEL 8 / TLS)
# Drop into:  /etc/httpd/conf.d/acv-docs.conf
# =============================================================

# Redirect HTTP -> HTTPS
<VirtualHost *:80>
    ServerName _default_
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog  /var/log/httpd/acv-docs-error.log
    CustomLog /var/log/httpd/acv-docs-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName _default_

    DocumentRoot /var/www/acv-docs

    SSLEngine on
    SSLCertificateFile      /etc/pki/acv-docs/fullchain.pem
    SSLCertificateKeyFile   /etc/pki/acv-docs/privkey.pem

    # TLS hardening
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES:!RC4
    SSLHonorCipherOrder     on

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <Directory "/var/www/acv-docs">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Cache static assets, no-cache HTML
    <FilesMatch "\.(css|js|svg|png|jpe?g|gif|ico|woff2?)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # Gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog  /var/log/httpd/acv-docs-error.log
    CustomLog /var/log/httpd/acv-docs-access.log combined
</VirtualHost>
