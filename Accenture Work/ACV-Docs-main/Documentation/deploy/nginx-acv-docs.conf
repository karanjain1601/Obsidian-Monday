# =============================================================
# nginx — ACV Documentation Hub (RHEL 8 / static site over TLS)
# Drop into:  /etc/nginx/conf.d/acv-docs.conf
# =============================================================

# Redirect all HTTP traffic to HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ACME / health check passthrough (optional)
    location /.well-known/acme-challenge/ {
        root /var/www/acv-docs;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS site
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # ----- TLS material (generated from the .p12 by deploy.sh) -----
    ssl_certificate           /etc/pki/acv-docs/fullchain.pem;
    ssl_certificate_key       /etc/pki/acv-docs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:ACV_DOCS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ----- Document root -----
    root  /var/www/acv-docs;
    index index.html;

    # Trailing-slash handling for directory requests so relative
    # paths like styles.css resolve correctly.
    # /site            -> /site/index.html
    # /acv-commons/site -> /acv-commons/site/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long cache for static assets (immutable per build)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Don't cache HTML — content can change between builds
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/acv-docs.access.log;
    error_log  /var/log/nginx/acv-docs.error.log warn;

    # Gzip
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
    gzip_vary         on;
}
